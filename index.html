<!DOCTYPE html>
<html lang="en">
<head>
<title>Javascript task 2</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/scripts.js" defer></script>
</head>
<body>
    <main>
        <section>
            <form>            
                <h1>Student management platform</h1>
                <div class="input-section">
                    <label>Student name</label>
                    <input class="input-field" id="student-name" type="text">
                </div>
                <div class="input-section">
                    <label>Student mark</label>
                    <input class="input-field" id="student-mark" type="number" min="0" max="100">
                </div>
                <div class="result-section">
                    <label>Result</label><br/>
                    <label id="display-result"></label>
                </div>
               <button type="submit" onclick="submitMark(event)">Capture student mark</button>
            </form>
        </section>
        <section class="results-section">
            <h2>Results</h2>
            <ul class="table-head">
                <li>Name</li>
                <li>Mark</li>
                <li>Result</li>
                <li>Grade</li>
            </ul>
            <ul id="student-results"></ul>
            <p id="no-results"></p>
        </section>
    </main>
</body>
</html>
